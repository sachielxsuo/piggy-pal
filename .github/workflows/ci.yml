name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...

  client:
    name: Client (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Pub get
        working-directory: client
        run: flutter pub get
      - name: Analyze
        working-directory: client
        run: flutter analyze
      - name: Test
        working-directory: client
        run: flutter test
      # release 包会走 R8；这一步同时验证 build.sh 里的 JNI 关键类/签名校验。
      # 仓库里没有 server/.env，token 为空，仅用于构建校验，不产出可分发包。
      - name: Build release APK (R8 check)
        run: ./build.sh
