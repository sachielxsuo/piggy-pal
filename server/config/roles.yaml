# 角色定义：加角色 = 在这里加一个条目，不用改代码、不碰数据库
# 字段说明：
#   voice_id：腾讯云 TTS 音色 ID（数字），在「语音合成控制台 → 音色列表」查询。
#     基础版声音复刻（10-20 分钟语料）完成后返回的也是数字 VoiceType，直接填这里。
#   fast_voice_id：一句话版声音复刻（5-15 秒语料）返回的 FastVoiceType（字符串，如 WCHN-xxx）。
#     填了它就会用 VoiceType=200000000 + FastVoiceType，并忽略上面的 voice_id；
#     缓存键含这个 ID，换音色后不会命中旧音频。
#   fallback_voice_id：备用音色。主音色的资源包额度用尽（PkgExhausted）时自动顶上，
#     只在出故障时生效；不填则失败就静音。
#   speed：TTS 语速（0.6–2.0），不填按 0.9。4-6 岁非母语儿童听正常语速的英文连读很吃力，
#     所以统一放慢；乔治更小，可以再慢一点。改了 speed 会让旧缓存失效（缓存键含语速），
#     首次请求重新合成一次，之后继续命中磁盘缓存。
#     已用真实 API 验证：403000 云小朵（女童声）/ 502007 智小虎（聊天童声），中英文、16k/24k。
#     省钱备选：101016 智甜（女童声）/ 101015 智萌（男童声），精品音色，中文。
#   catchphrase：中文口号（首页角色卡名字下方展示）
#   say_en：英文口号（首页圆角标签展示）
#   hello：进入对话时的开场白（客户端问候气泡 + 可 TTS）
#   persona：LLM 人设（仅服务端用，不暴露给客户端）
# 客户端角色图片按约定取 assets/<role_id>.png，无需在此配置。
roles:
  - role_id: peppa
    name: 佩奇
    en: Peppa
    voice_id: "403000"   # 云小朵（特色女童声，超自然大模型）；省钱可换 101016 智甜
    fallback_voice_id: "101016"   # 智甜（标准女声）：云小朵资源包用尽时顶上
    # fast_voice_id: "WCHN-xxxxxxxx"   # 一句话版复刻完成后填这里，优先于 voice_id
    speed: 0.9
    persona: "你是佩奇，一只 4 岁的小猪，活泼爱笑、有耐心，永远鼓励宝宝。说话简单、句子短、多用英语日常词，配合中文引导。"
    catchphrase: "嗨，我是佩奇～ 今天想和我一起玩吗？"
    say_en: "H-hi! Let's sing and play together! 🎵"
    hello: "嗨，我是佩奇～ 今天想和我一起玩什么呀？"
  - role_id: george
    name: 乔治
    en: George
    voice_id: "502007"   # 智小虎（聊天童声，超自然大模型）；省钱可换 101015 智萌
    fallback_voice_id: "101015"   # 智萌（标准男声）：智小虎资源包用尽时顶上
    # fast_voice_id: "WCHN-xxxxxxxx"   # 一句话版复刻完成后填这里，优先于 voice_id
    # 乔治台词更短、更奶萌，语速再放慢一点（家长反馈 0.85 偏快）
    speed: 0.8
    persona: "你是乔治，佩奇的弟弟，最爱恐龙。话不多、句子更短、语气奶萌，喜欢说「恐龙」。"
    catchphrase: "恐龙！我是乔治～ 一起玩恐龙吧！"
    say_en: "Dine-saw! 恐龙来啦！🦖"
    hello: "恐龙！我是乔治～ 我们一起玩恐龙吧！🦖"
