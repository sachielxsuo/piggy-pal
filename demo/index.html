<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>英语陪伴 · 佩奇</title>
<style>
  :root {
    --blue: #3b82f6;
    --blue-deep: #1d4ed8;
    --blue-dark: #1e40af;
    --blue-soft: #dbeafe;
    --blue-bg: #eff6ff;
    --ink: #1e293b;
    --ink-sub: #64748b;
    --grass: #a7e3b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #bfdbfe 0%, #93c5fd 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px; color: var(--ink);
  }
  .phone {
    width: 400px; max-width: 100%; height: 820px; max-height: 94vh;
    background: #f2f8ff; border-radius: 40px; position: relative; overflow: hidden;
    box-shadow: 0 24px 60px rgba(30, 64, 175, .35), inset 0 0 0 2px #fff;
  }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; transition: opacity .3s, transform .3s; }
  .screen.hidden { opacity: 0; transform: translateX(40px); pointer-events: none; }

  /* ===== 场景背景（沉浸式） ===== */
  .scene { position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(180deg, #8ec5fc 0%, #cfe4fd 45%, #eef6ff 78%, #f6fbff 100%); }
  .sun { position: absolute; top: 64px; right: 44px; width: 84px; height: 84px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fef3c7 0%, #fcd34d 60%, #fbbf24 100%);
    box-shadow: 0 0 70px 18px rgba(253, 224, 71, .55); }
  .cloud { position: absolute; background: rgba(255,255,255,.95); border-radius: 999px; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud.c1 { width: 110px; height: 34px; top: 120px; left: 34px; opacity: .9; }
  .cloud.c1::before { width: 44px; height: 44px; top: -22px; left: 16px; }
  .cloud.c1::after { width: 32px; height: 32px; top: -14px; left: 56px; }
  .cloud.c2 { width: 80px; height: 26px; top: 200px; right: 30px; opacity: .8; }
  .cloud.c2::before { width: 32px; height: 32px; top: -16px; left: 12px; }
  .cloud.c2::after { width: 24px; height: 24px; top: -10px; left: 42px; }
  .cloud.c3 { width: 130px; height: 38px; top: 320px; left: -30px; opacity: .65; }
  .cloud.c3::before { width: 48px; height: 48px; top: -24px; left: 22px; }
  .cloud.c3::after { width: 36px; height: 36px; top: -16px; left: 68px; }
  .hill { position: absolute; bottom: -60px; left: -12%; width: 124%; height: 190px;
    background: var(--grass); border-radius: 50% 50% 0 0; opacity: .9; }
  .hill.back { bottom: -20px; left: -30%; width: 160%; height: 160px; background: #c8efD4; opacity: .7; }

  /* ===== 首页 ===== */
  .home { align-items: stretch; }
  .home-top { position: relative; z-index: 6; display: flex; justify-content: space-between; align-items: center; padding: 22px 20px 0; }
  .brand { font-size: 14px; color: var(--blue-dark); font-weight: 800; letter-spacing: 2px; text-shadow: 0 1px 0 #fff; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,.8); color: var(--blue-deep); font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(30,64,175,.14); backdrop-filter: blur(4px);
  }
  .hero { flex: 1; position: relative; z-index: 5; min-height: 0; }
  .arrow {
    position: absolute; top: 42%; z-index: 6;
    width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,.55); color: #fff; font-size: 24px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(30,64,175,.18); text-shadow: 0 1px 4px rgba(30,64,175,.35);
    backdrop-filter: blur(3px); transition: transform .12s;
  }
  .arrow.left { left: 12px; }
  .arrow.right { right: 12px; }
  .arrow:active { transform: scale(.88); }
  .hero-viewport { width: 100%; height: 100%; overflow: hidden; touch-action: pan-y; cursor: grab; }
  .hero-viewport:active { cursor: grabbing; }
  .hero-track { display: flex; height: 100%; transition: transform .38s cubic-bezier(.25,.8,.35,1); }
  .hero-slide { width: 100%; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; padding-bottom: 4px; }
  .char-img { height: 46%; max-height: 340px; object-fit: contain; filter: drop-shadow(0 18px 22px rgba(30,64,175,.25)); animation: float 3.8s ease-in-out infinite; }
  @keyframes float { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-12px);} }
  .role-name { font-size: 26px; font-weight: 800; color: var(--blue-dark); margin-top: 10px; text-shadow: 0 1px 0 #fff; }
  .role-name .en { font-size: 14px; font-weight: 700; color: #ec4899; margin-left: 8px; letter-spacing: .5px; }
  .catch { margin-top: 6px; font-size: 15px; color: var(--ink-sub); }
  .say-en {
    margin-top: 10px; background: rgba(255,255,255,.9); border-radius: 999px; padding: 8px 18px;
    font-size: 14px; color: var(--blue-dark); font-weight: 600; box-shadow: 0 6px 16px rgba(30,64,175,.10);
  }

  .home-actions { position: relative; z-index: 6; padding: 10px 22px 22px; }
  .btn-start {
    width: 100%; border: none; cursor: pointer; border-radius: 999px; padding: 17px;
    font-size: 19px; font-weight: 800; letter-spacing: 2px; color: #fff;
    background: linear-gradient(135deg, #60a5fa 0%, var(--blue) 45%, var(--blue-deep) 100%);
    box-shadow: 0 12px 28px rgba(37, 99, 235, .42), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .12s;
  }
  .btn-start:active { transform: scale(.97); }
  .home-tip { display: block; text-align: center; margin-top: 10px; font-size: 11px; color: var(--ink-sub); }

  /* ===== 对话页 ===== */
  .chat { background: #f4f9ff; }
  .chat-hero { position: relative; height: 252px; flex-shrink: 0; overflow: hidden;
    background: linear-gradient(180deg, #8ec5fc 0%, #cfe4fd 60%, #f4f9ff 100%); }
  .chat-hero .sun { top: 30px; right: 26px; width: 56px; height: 56px; }
  .chat-hero .cloud.c1 { top: 58px; left: 20px; transform: scale(.7); }
  .chat-hero .hill { height: 110px; bottom: -40px; }
  .chat-topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 0; z-index: 4; }
  .chat-title { font-size: 16px; font-weight: 800; color: var(--blue-dark); text-shadow: 0 1px 0 #fff; }
  .chat-char { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); height: 172px; object-fit: contain; filter: drop-shadow(0 12px 14px rgba(30,64,175,.22)); animation: float 3.8s ease-in-out infinite; }

  .msgs { flex: 1; overflow-y: auto; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
  .time-tag { align-self: center; font-size: 11px; color: var(--ink-sub); margin-bottom: 2px; }
  .bubble { max-width: 84%; padding: 14px 18px; font-size: 15px; line-height: 1.6; border-radius: 22px; word-break: break-word; animation: pop .25s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
  .bubble.ai { align-self: flex-start; background: #fff; color: var(--ink); border-bottom-left-radius: 8px; box-shadow: 0 4px 14px rgba(30,64,175,.08); }
  .bubble.child { align-self: flex-end; background: linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%); color: #fff; border-bottom-right-radius: 8px; box-shadow: 0 6px 16px rgba(37,99,235,.25); }
  .bubble .en-line { color: var(--blue-deep); font-weight: 600; }
  .bubble.ai .en-line { color: var(--blue-deep); }
  .bubble.child .en-line { color: #bfdbfe; }
  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing span { width: 7px; height: 7px; background: var(--ink-sub); border-radius: 50%; animation: blink 1s infinite; }
  .typing span:nth-child(2){ animation-delay: .2s; } .typing span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,100%{opacity:.2;} 50%{opacity:1;} }

  .chat-bottom { flex-shrink: 0; padding: 8px 16px 14px; background: linear-gradient(180deg, rgba(244,249,255,0) 0%, #f4f9ff 30%); }
  .input-row { display: none; gap: 8px; margin-bottom: 10px; }
  .input-row.show { display: flex; }
  .input-box { flex: 1; display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 999px; padding: 6px 16px; box-shadow: 0 4px 14px rgba(30,64,175,.08); }
  .input-box input { flex: 1; border: none; outline: none; background: transparent; font-size: 15px; color: var(--ink); }
  .input-box button { border: none; background: var(--blue); color: #fff; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px; }
  .action-row { display: flex; gap: 10px; }
  .btn-talk {
    flex: 1; border: none; cursor: pointer; border-radius: 999px; padding: 16px;
    font-size: 17px; font-weight: 700; letter-spacing: 1px; color: #fff;
    background: linear-gradient(135deg, #60a5fa 0%, var(--blue) 45%, var(--blue-deep) 100%);
    box-shadow: 0 10px 22px rgba(37,99,235,.35); transition: transform .12s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-talk:active { transform: scale(.97); }
  .btn-talk.listening { background: linear-gradient(135deg, #f87171 0%, #dc2626 100%); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{ box-shadow: 0 0 0 0 rgba(220,38,38,.4);} 70%{ box-shadow: 0 0 0 16px rgba(220,38,38,0);} }
  .round-btn {
    width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer; font-size: 20px;
    background: #fff; box-shadow: 0 6px 16px rgba(30,64,175,.12); display: flex; align-items: center; justify-content: center;
  }
  .legal { text-align: center; font-size: 10px; color: #94a3b8; margin-top: 8px; }

  /* ===== 抽屉 ===== */
  .overlay { position: absolute; inset: 0; background: rgba(15,23,42,.35); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .drawer { position: absolute; top: 0; left: 0; bottom: 0; width: 72%; z-index: 30; background: #fff;
    transform: translateX(-105%); transition: transform .28s cubic-bezier(.22,.8,.36,1);
    display: flex; flex-direction: column; padding: 26px 20px; box-shadow: 8px 0 30px rgba(30,64,175,.2); }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .drawer-head .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--blue-soft); display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .drawer-head .t { font-size: 16px; font-weight: 700; }
  .drawer-head .s { font-size: 12px; color: var(--ink-sub); }
  .drawer-item { display: flex; align-items: center; gap: 14px; padding: 15px 12px; border-radius: 14px; cursor: pointer; font-size: 15px; font-weight: 600; }
  .drawer-item:active { background: var(--blue-bg); }
  .drawer-item .ico { width: 36px; height: 36px; border-radius: 12px; background: var(--blue-soft); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .drawer-item .sub { margin-left: auto; font-size: 12px; color: var(--ink-sub); font-weight: 500; }
  .drawer-divider { height: 1px; background: #eef2f7; margin: 12px 0; }
</style>
</head>
<body>
  <div class="phone">

    <!-- 首页（沉浸式） -->
    <div class="screen home" id="home">
      <div class="scene">
        <div class="sun"></div>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
        <div class="hill back"></div>
        <div class="hill"></div>
      </div>
      <div class="home-top">
        <button class="icon-btn" onclick="openDrawer()">☰</button>
        <span class="brand">英语陪伴</span>
      </div>

      <div class="hero">
        <button class="arrow left" onclick="goTo(roleIdx-1)">‹</button>
        <div class="hero-viewport" id="viewport">
          <div class="hero-track" id="track"></div>
        </div>
        <button class="arrow right" onclick="goTo(roleIdx+1)">›</button>
      </div>

      <div class="home-actions">
        <button class="btn-start" onclick="openChat()">✨ 开始陪伴</button>
        <span class="home-tip">自由式英语对话 · 全正向鼓励</span>
      </div>
    </div>

    <!-- 对话页 -->
    <div class="screen chat hidden" id="chat">
      <div class="chat-hero">
        <div class="sun"></div>
        <div class="cloud c1"></div>
        <div class="hill"></div>
        <div class="chat-topbar">
          <button class="icon-btn" onclick="openHome()">‹</button>
          <span class="chat-title" id="chatTitle">佩奇</span>
          <button class="icon-btn">🔊</button>
        </div>
        <img class="chat-char" id="chatChar" src="assets/peppa.png" alt=""
           onerror="avatarFallback(this, '佩奇', 'peppa')" />
      </div>

      <div class="msgs" id="msgs"></div>

      <div class="chat-bottom">
        <div class="input-row" id="inputRow">
          <div class="input-box">
            <input id="text" type="text" placeholder="打字和TA说…" onkeydown="if(event.key==='Enter')sendText()" />
            <button onclick="sendText()">➤</button>
          </div>
        </div>
        <div class="action-row">
          <button class="btn-talk" id="mic" onclick="speak()">🎤 点击说话</button>
          <button class="round-btn" onclick="toggleInput()" id="kbBtn">⌨️</button>
        </div>
        <div class="legal">演示原型 · 对话内容由 AI 生成</div>
      </div>
    </div>

    <!-- 遮罩 + 抽屉 -->
    <div class="overlay" id="overlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="drawer">
      <div class="drawer-head">
        <div class="avatar">👨‍👩‍👧</div>
        <div>
          <div class="t">安安的成长空间</div>
          <div class="s">家庭 · 自用版</div>
        </div>
      </div>
      <div class="drawer-item" onclick="toast('家长中心')"><span class="ico">🔐</span> 家长中心<span class="sub">PIN 进入 ›</span></div>
      <div class="drawer-item" onclick="toast('选宝宝')"><span class="ico">👶</span> 选宝宝<span class="sub">安安 ›</span></div>
      <div class="drawer-divider"></div>
      <div class="drawer-item" onclick="toast('星星奖励')"><span class="ico">⭐</span> 星星奖励<span class="sub">本周 3 颗 ›</span></div>
      <div class="drawer-item" onclick="toast('关于')"><span class="ico">ℹ️</span> 关于<span class="sub">v0.1 ›</span></div>
    </div>

  </div>

<script>
  const $ = id => document.getElementById(id);

  // 角色图缺失时的占位头像：名字首字 + 按 id 选定的颜色（和客户端的 RoleAvatar 一致）
  function avatarFallback(img, name, id) {
    if (img.src.indexOf('data:') === 0) return;
    const palette = ['#EC4899', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EF4444'];
    let sum = 0;
    for (const ch of (id || '')) sum += ch.charCodeAt(0);
    const color = palette[sum % palette.length];
    const initial = (name || '?').charAt(0);
    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
        '<circle cx="50" cy="50" r="46" fill="' + color + '26" stroke="' + color + '" stroke-width="6"/>' +
        '<text x="50" y="53" text-anchor="middle" font-size="44" font-weight="700" ' +
          'font-family="sans-serif" fill="' + color + '">' + initial + '</text>' +
      '</svg>';
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  // 角色数据（对应 roles.yaml）
  //
  // 角色图 assets/<id>.png 的版权归权利人，仓库里没有，需要自己放一份；
  // 缺图时 avatarFallback() 会画一个「名字首字 + 纯色圆」的占位头像。

  const roles = [
    { id: 'peppa',  name: '佩奇', en: 'Peppa',  img: 'assets/peppa.png',
      catch: '嗨，我是佩奇～ 今天想和我一起玩吗？',
      say: "H-hi! Let's sing and play together! 🎵",
      hello: '嗨，我是佩奇～ 今天想和我一起玩什么呀？' },
    { id: 'george', name: '乔治', en: 'George', img: 'assets/george.png',
      catch: '恐龙！我是乔治～ 一起玩恐龙吧！',
      say: 'Dine-saw! 恐龙来啦！🦖',
      hello: '恐龙！我是乔治～ 我们一起玩恐龙吧！🦖' }
  ];
  let roleIdx = 0;

  // ===== 首页整块 swiper（人物+名字+介绍+英文） =====
  function buildTrack() {
    $('track').innerHTML = roles.map(r =>
      '<div class="hero-slide">' +
        '<img class="char-img" src="' + r.img + '" alt=""' +
          ' onerror="avatarFallback(this, \'' + r.name + '\', \'' + r.id + '\')">' +
        '<div class="role-name">' + r.name + ' <span class="en">' + r.en + '</span></div>' +
        '<div class="catch">' + r.catch + '</div>' +
        '<div class="say-en">' + r.say + '</div>' +
      '</div>'
    ).join('');
  }
  function goTo(i) {
    roleIdx = (i + roles.length) % roles.length;
    $('track').style.transform = 'translateX(' + (-roleIdx * $('viewport').clientWidth) + 'px)';
  }
  const viewport = $('viewport'), track = $('track');
  let dragStart = null, dragCur = 0;
  viewport.addEventListener('pointerdown', e => {
    dragStart = e.clientX; dragCur = 0;
    track.style.transition = 'none';
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', e => {
    if (dragStart === null) return;
    dragCur = e.clientX - dragStart;
    track.style.transform = 'translateX(' + (-roleIdx * viewport.clientWidth + dragCur) + 'px)';
  });
  viewport.addEventListener('pointerup', () => {
    if (dragStart === null) return;
    dragStart = null;
    track.style.transition = 'transform .38s cubic-bezier(.25,.8,.35,1)';
    const th = viewport.clientWidth / 4;
    if (dragCur < -th) goTo(roleIdx + 1);
    else if (dragCur > th) goTo(roleIdx - 1);
    else goTo(roleIdx);
  });
  viewport.addEventListener('pointercancel', () => {
    dragStart = null;
    track.style.transition = 'transform .38s cubic-bezier(.25,.8,.35,1)';
    goTo(roleIdx);
  });

  // ===== 抽屉 =====
  function openDrawer() { $('drawer').classList.add('open'); $('overlay').classList.add('show'); }
  function closeDrawer() { $('drawer').classList.remove('open'); $('overlay').classList.remove('show'); }
  function toast(name) { closeDrawer(); alert('【演示】' + name + ' 为二级入口，正式版在此接入。'); }

  // 左边缘右滑打开抽屉
  let tx = 0, ty = 0;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (tx < 40 && dx > 60 && Math.abs(dx) > Math.abs(dy)) openDrawer();
  });

  // ===== 对话 =====
  const msgs = $('msgs');
  const script = [
    { who: 'child', text: '我想唱歌！' },
    { who: 'ai',    text: '好呀好呀！我们一起唱 <span class="en-line">Baa, Baa, Black Sheep</span> 好不好？🎵' },
    { who: 'child', text: 'Baa baa!' },
    { who: 'ai',    text: '太棒了安安！你唱得真好，给你一颗小星星 ⭐' },
    { who: 'child', text: '还想听故事！' },
    { who: 'ai',    text: '那我们讲一个小猪去海边玩的故事吧～准备好了吗？' },
  ];
  let step = 0;

  function addMsg(who, html) {
    const b = document.createElement('div');
    b.className = 'bubble ' + who;
    b.innerHTML = html;
    msgs.appendChild(b);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function showTyping() {
    const b = document.createElement('div');
    b.className = 'bubble ai'; b.id = 'typing';
    b.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    msgs.appendChild(b); msgs.scrollTop = msgs.scrollHeight;
  }
  function removeTyping() { const t = $('typing'); if (t) t.remove(); }

  function speak() {
    const mic = $('mic');
    mic.classList.add('listening');
    mic.innerHTML = '👂 正在听…';
    showTyping();
    setTimeout(() => {
      mic.classList.remove('listening');
      mic.innerHTML = '🎤 点击说话';
      const next = script[step] && script[step].who === 'child';
      addMsg('child', next ? script[step].text : 'I like it!');
      if (next) step++;
      setTimeout(() => {
        removeTyping();
        if (script[step] && script[step].who === 'ai') { addMsg('ai', script[step].text); step++; }
        else addMsg('ai', "That's great! <span class='en-line'>You are so good!</span> 你太棒啦 ⭐");
      }, 900);
    }, 1200);
  }
  function sendText() {
    const inp = $('text'), v = inp.value.trim();
    if (!v) return;
    addMsg('child', v); inp.value = '';
    showTyping();
    setTimeout(() => { removeTyping(); addMsg('ai', "That's great! <span class='en-line'>You are so good!</span> 你太棒啦 ⭐"); }, 900);
  }
  function toggleInput() {
    const r = $('inputRow');
    r.classList.toggle('show');
    if (r.classList.contains('show')) $('text').focus();
  }

  function openChat() {
    const r = roles[roleIdx];
    $('home').classList.add('hidden'); $('chat').classList.remove('hidden');
    $('chatTitle').textContent = r.name + ' ' + r.en;
    $('chatChar').src = r.img;
    if (step > 0) return;
    msgs.innerHTML = '';
    const t = document.createElement('div');
    t.className = 'time-tag'; t.textContent = '刚刚';
    msgs.appendChild(t);
    addMsg('ai', r.hello);
    step = 1;
  }
  function openHome() { $('chat').classList.add('hidden'); $('home').classList.remove('hidden'); }

  buildTrack();
</script>
</body>
</html>
